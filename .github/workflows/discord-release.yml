name: Announce GitHub releases on Discord
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      backfill:
        description: Post the previous releases to announcements
        type: boolean
        default: false
permissions: {}
jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Format and announce release
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          BACKFILL: ${{ github.event_name == 'workflow_dispatch' && inputs.backfill }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && !inputs.backfill }}
        run: |
          python3 - <<'PYCODE'
          import html
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          
          IMAGE = re.compile(r'!\[([^\]]*)\]\(([^\s)]+)(?:\s+"[^"]*")?\)|<img\b[^>]*>', re.I)
          
          
          def pieces(release, repository):
              body = release.get('body') or 'No release notes were provided.'
              # Omit the optional support paragraph and its linked donation button.
              body = re.sub(r'(?im)^\s*(?:---\s*\n\s*)?\*\*Enjoying Graden\?\*\*[^\n]*\n?', '', body)
              body = re.sub(r'<a\b[^>]*href=["\']https?://(?:www\.)?buymeacoffee\.com/[^"\']*["\'][^>]*>.*?</a>', '', body, flags=re.I | re.S)
              body = re.sub(r'!?\[[^\]]*\]\(https?://(?:www\.)?buymeacoffee\.com/[^)]*\)', '', body, flags=re.I)
              body = re.sub(r'<img\b[^>]*src=["\']https?://[^"\']*buymeacoffee\.com/[^"\']*["\'][^>]*>', '', body, flags=re.I)
              body = re.sub(r'<a\s+[^>]*href=["\']([^"\']+)["\'][^>]*>\s*(<img\b[^>]*>)\s*</a>',
                            lambda m: m.group(2) + '\n[Image link](' + m.group(1) + ')', body, flags=re.I)
              tag = urllib.parse.quote(release['tag_name'], safe='')
              raw_base = f'https://raw.githubusercontent.com/{repository}/{tag}/'
              def src(match):
                  if match.group(2):
                      return match.group(2), match.group(1)
                  attrs = dict(re.findall(r'([\w-]+)\s*=\s*["\']([^"\']*)["\']', match.group(0)))
                  return attrs.get('src', ''), attrs.get('alt', '')
              def clean(text):
                  text = re.sub(r'<a\s+[^>]*href=["\']([^"\']+)["\'][^>]*>(.*?)</a>',
                                lambda m: f'[{m.group(2)}]({m.group(1)})' if m.group(2).strip() else '', text, flags=re.I | re.S)
                  text = re.sub(r'</?a\b[^>]*>', '', text, flags=re.I)
                  text = re.sub(r'<br\s*/?>', '\n', text, flags=re.I)
                  text = re.sub(r'<[^>]+>', '', text)
                  return html.unescape(text).strip()
              result = []
              def add_text(text):
                  text = clean(text)
                  while text:
                      if len(text) <= 1850:
                          result.append({'content': text})
                          break
                      cut = text.rfind('\n', 0, 1850)
                      if cut < 500:
                          cut = text.rfind(' ', 0, 1850)
                      if cut < 1:
                          cut = 1850
                      result.append({'content': text[:cut]})
                      text = text[cut:].lstrip('\n ')
              pos = 0
              for match in IMAGE.finditer(body):
                  add_text(body[pos:match.start()])
                  url, alt = src(match)
                  url = urllib.parse.urljoin(raw_base, html.unescape(url))
                  if urllib.parse.urlparse(url).scheme in ('http', 'https'):
                      result.append({'content': alt or '🖼️ Release image', 'embeds': [{'image': {'url': url}}]})
                  pos = match.end()
              add_text(body[pos:])
              title = release.get('name') or release['tag_name']
              result.insert(0, {'content': f"🚀 **{title}**\n\n🔗 Release page: {release['html_url']}"})
              for item in result:
                  item['allowed_mentions'] = {'parse': []}
              return result
          
          
          def main():
              with open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8') as event_file:
                  event = json.load(event_file)
              dry = os.environ.get('DRY_RUN') == 'true'
              repo = os.environ['GITHUB_REPOSITORY']
              backfill = os.environ.get('BACKFILL') == 'true'
              if dry or backfill:
                  request = urllib.request.Request(f'https://api.github.com/repos/{repo}/releases?per_page=100', headers={'User-Agent': 'Graden-release-announcer', 'Accept': 'application/vnd.github+json'})
                  with urllib.request.urlopen(request) as response:
                      releases = json.load(response)
                  if not releases:
                      raise RuntimeError('No release available for the dry run')
                  releases = list(reversed([r for r in releases if not r.get('draft')])) if backfill else releases[:1]
              else:
                  releases = [event['release']]
              messages = []
              for release in releases:
                  batch = pieces(release, repo)
                  if backfill:
                      date = (release.get('published_at') or '')[:10]
                      batch[0]['content'] = '📚 **Earlier release** · ' + date + '\n' + batch[0]['content']
                  messages.extend(batch)
              url = os.environ['DISCORD_WEBHOOK_URL']
              if not re.fullmatch(r'https://(?:discord(?:app)?\.com)/api/webhooks/\d+/[\w.-]+', url):
                  raise RuntimeError('Webhook secret is missing or is not a Discord webhook URL')
              if dry:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Graden-release-announcer'})
                  try:
                      with urllib.request.urlopen(req) as response:
                          if response.status != 200:
                              raise RuntimeError('Webhook validation failed')
                  except Exception:
                      raise RuntimeError('Webhook validation failed') from None
                  print(f'Dry run succeeded: {len(messages)} messages, {sum("embeds" in m for m in messages)} images; no message sent.')
                  return
              for message in messages:
                  data = json.dumps(message).encode('utf-8')
                  for attempt in range(5):
                      request = urllib.request.Request(url, data=data, headers={'Content-Type': 'application/json', 'User-Agent': 'Graden-release-announcer'}, method='POST')
                      try:
                          with urllib.request.urlopen(request) as response:
                              response.read()
                          break
                      except urllib.error.HTTPError as error:
                          if error.code == 429 and attempt < 4:
                              delay = json.loads(error.read()).get('retry_after', 2)
                              time.sleep(min(float(delay), 60))
                              continue
                          raise RuntimeError(f'Discord rejected a message (HTTP {error.code})') from None
                      except Exception:
                          raise RuntimeError('Discord webhook request failed') from None
              print(f'Posted {len(messages)} release messages.')
          
          
          if __name__ == '__main__':
              main()
          PYCODE

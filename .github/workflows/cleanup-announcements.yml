name: Clean donation material from old announcements
on: workflow_dispatch
permissions: {}
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Remove donation material
        env:
          HOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
        run: |
          python3 - <<'PY'
          import json, os, re, time, urllib.error, urllib.request
          root = os.environ['HOOK'].rstrip('/') + '/messages/'
          edits = ['1571262199136125149', '1571262206128160910', '1571262221055692860']
          removals = ['1571262201547849771', '1571262203112333322', '1571262208736886936', '1571262209688866927', '1571262223743979714', '1571262229091852479']
          def request(message, method='GET', payload=None):
              for attempt in range(5):
                  try:
                      data = json.dumps(payload).encode() if payload is not None else None
                      req = urllib.request.Request(root + message, data=data, method=method, headers={'Content-Type':'application/json', 'User-Agent':'Graden-release-cleanup'})
                      with urllib.request.urlopen(req) as r:
                          raw = r.read()
                          return json.loads(raw) if raw else None
                  except urllib.error.HTTPError as e:
                      if e.code == 429 and attempt < 4:
                          time.sleep(min(float(json.loads(e.read()).get('retry_after', 2)), 60))
                          continue
                      raise RuntimeError(f'Cleanup failed: HTTP {e.code}') from None
                  except Exception:
                      raise RuntimeError('Cleanup request failed') from None
          for message in edits:
              old = request(message)['content']
              new = re.sub(r'(?im)\n*---\s*\n\s*\*\*Enjoying Graden\?\*\*[^\n]*\s*$', '', old).rstrip()
              if new == old or not new:
                  raise RuntimeError('Expected donation text was not found; stopped without editing this message')
              request(message, 'PATCH', {'content':new, 'allowed_mentions':{'parse':[]}})
          for message in removals:
              existing = request(message)
              if existing.get('content') not in ('Buy Me a Coffee', '[Image link](https://buymeacoffee.com/pixelgamer4k)'):
                  raise RuntimeError('Unexpected message content; stopped without deleting this message')
              request(message, 'DELETE')
          print('Removed donation sections from three release notes and removed six donation-only posts.')
          PY
